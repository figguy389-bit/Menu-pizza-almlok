<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو مطعم بيتزا الملوك</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--card:#1b1a17;--gold:#e6b422;--gold2:#b8860b;--tx:#f5efe0;--mu:#a99f8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;max-width:640px;margin:auto}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#14110a;border-bottom:1px solid #3a2f12}
.logo{width:68px;height:68px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#fff}
.pill{border:1px solid var(--gold2);background:none;color:var(--gold);border-radius:30px;padding:9px 16px;font-size:15px;position:relative}
.bd{position:absolute;top:-8px;left:-6px;background:var(--gold);color:#000;border-radius:50%;min-width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.hero{margin:14px 12px;height:190px;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(135deg,#3a0d0d,#100a02 60%,#4a3508)}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .8s;text-align:center;padding:10px}
.sl.on{opacity:1}.sl h2{margin:0;font-size:26px;color:var(--gold)}.sl p{margin:0;color:var(--tx)}
.sl img{width:90px;height:90px;border-radius:50%}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:10px;height:10px;border-radius:9px;background:#fff6;transition:.3s}.dots i.on{width:34px;background:var(--gold)}
.strip{direction:ltr;overflow-x:auto;white-space:nowrap;border-top:1px solid #4a4030;border-bottom:1px solid #4a4030;padding:14px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cat{display:inline-block;width:112px;margin:0 8px;text-align:center;vertical-align:top;white-space:normal;direction:rtl;color:var(--tx)}
.cat .ci{width:112px;height:112px;border-radius:30px;background:#2a2417 center/cover;display:flex;align-items:center;justify-content:center;font-size:52px;border:2px solid transparent;transition:.3s}
.cat span{display:block;margin-top:8px;font-size:15px;color:var(--mu)}
.cat.on .ci{border-color:var(--gold);box-shadow:0 0 18px #e6b42266}.cat.on span{color:var(--gold);font-weight:700}
.tg{display:flex;gap:10px;padding:14px 18px}.tg button{background:none;border:2px solid var(--mu);color:var(--mu);border-radius:8px;width:44px;height:38px;font-size:18px}.tg button.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 14px 20px}
.grid.list{grid-template-columns:1fr}
.card{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid #2c2618}
.im{height:288px;padding-bottom:58px;background:#2a2417 center/contain no-repeat;background-origin:content-box;position:relative;display:flex;align-items:center;justify-content:center;font-size:105px}
.list .im{height:188px}
.im.has{height:auto;padding:0;display:block;background:none}
.im.has img{width:100%;display:block}
.im.has .cap{position:static;background:none;padding:10px 14px 14px}
.grid{align-items:start}
.cap{position:absolute;bottom:0;left:0;right:0;padding:12px 14px;background:linear-gradient(transparent,#000c);display:flex;justify-content:space-between;align-items:flex-end;gap:6px;font-size:14px;line-height:1.4}
.cap b{font-size:15px}.cap em{font-style:normal;color:var(--gold);font-weight:700;white-space:nowrap}
.pm{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.pm button{width:42px;height:42px;border-radius:50%;border:none;background:#eef0dd;font-size:26px;line-height:1;color:#222;position:relative}
.pm .q{background:var(--gold);font-size:16px;font-weight:700;width:auto;min-width:36px;border-radius:20px;padding:0 8px;height:42px;display:flex;align-items:center;justify-content:center;color:#000}
.sz{display:flex;gap:6px;padding:10px;flex-wrap:wrap}
.sz button{flex:1;border:1px solid #5a4a22;background:none;color:var(--tx);border-radius:12px;padding:7px 4px;font-size:12px}
.sz button.on{background:var(--gold);color:#000;font-weight:700}
.ed{position:absolute;top:64px;left:10px;z-index:3;background:#000a;color:#fff;border:1px solid var(--gold);border-radius:20px;padding:6px 12px;font-size:13px}
.fl{position:fixed;pointer-events:none;font-size:26px;z-index:99;transition:transform .9s cubic-bezier(.2,.8,.3,1),opacity .9s}
.ov{position:fixed;inset:0;z-index:50;background:#000d;display:flex;align-items:flex-end;justify-content:center}
.ov.c{align-items:center}
.sh{background:#17140d;width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:20px;border:1px solid #4a3a14}
.ov.c .sh{border-radius:26px;margin:14px}
.wel{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 0,#4a3508,#0b0905 70%);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:30px 20px;text-align:center;gap:14px}
.wel .logo{width:130px;height:130px}
.wel h1{margin:4px 0;font-size:24px;color:var(--gold)}
.ph{display:block;font-size:22px;color:var(--tx);background:#ffffff10;border:1px solid #4a3a14;border-radius:30px;padding:10px 26px;direction:ltr}
.go{width:100%;max-width:420px;padding:20px;border:2px solid #fff3;border-radius:60px;font-size:24px;font-weight:800;color:#000;background:linear-gradient(135deg,#ffe14a,#f2b705 40%,#000 41%,#2a2a2a 55%,#f2b705 56%,#ffe14a);background-size:200% 100%;animation:sh 3s linear infinite;box-shadow:0 0 28px #f2b705aa,inset 0 3px 8px #fff9;text-shadow:0 1px 0 #fff8}
@keyframes sh{to{background-position:-200% 0}}
.soc{display:flex;gap:16px;justify-content:center}
.soc a{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.soc svg{width:30px;height:30px;fill:#fff}
.pw{font-size:19px;font-weight:800;color:var(--gold);text-shadow:0 0 12px #e6b422aa;padding:6px 14px;display:block;animation:gl 2s ease-in-out infinite}
@keyframes gl{50%{text-shadow:0 0 26px #ffe14a;color:#ffe14a}}
.ft{margin-top:20px;padding:24px 16px 30px;text-align:center;background:#0a0804;border-top:1px solid #3a2f12;display:flex;flex-direction:column;align-items:center;gap:12px}
input,textarea,select{width:100%;background:#0f0d08;border:1px solid #5a4a22;color:var(--tx);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;margin:5px 0}
label{font-size:13px;color:var(--mu)}
.btn{background:var(--gold);color:#000;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:700;width:100%;margin-top:8px}
.btn.g{background:#2a2417;color:var(--gold)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #2c2618}
.ln .pm{position:static}.ln .pm button{width:34px;height:34px;font-size:20px}
.er{color:#ff7a7a;font-size:14px;min-height:20px}
.adm{margin:10px 12px;padding:14px;border:1px dashed var(--gold);border-radius:18px}
.w2{position:fixed;inset:0;z-index:100;overflow:auto;background:radial-gradient(ellipse at 50% -10%,#7a1414 0,#2a0606 45%,#050302 100%);display:flex;flex-direction:column;align-items:center;gap:16px;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 40px;text-align:center}
.w2:before{content:"🍕 🍔 🍟 🔥 👑 🥤 🍗 🍕 🍔 🍟 🔥 👑 🥤 🍗";position:fixed;inset:-90px 0 0;font-size:38px;opacity:.07;word-spacing:30px;line-height:90px;pointer-events:none;animation:dr 12s linear infinite}
@keyframes dr{to{transform:translateY(90px)}}
.rg{width:170px;height:170px;flex:none;border-radius:50%;padding:6px;background:conic-gradient(#ffe14a,#b8860b,#ffe14a,#7a5a00,#ffe14a);animation:sp 6s linear infinite;box-shadow:0 0 40px #f2b70588}
.rg img{width:100%;height:100%;border-radius:50%;background:#fff;object-fit:cover;animation:sp 6s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.t1{font-size:17px;color:#ffe9a8;margin:0}
.t2{font-size:36px;font-weight:900;margin:0;background:linear-gradient(90deg,#ffe14a,#fff,#f2b705);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.gl{width:100%;max-width:440px;background:#ffffff0f;border:1px solid #ffffff25;border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(8px)}
.wb{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#25d366,#0c8f43);border-radius:18px;padding:13px 18px;font-size:21px;font-weight:700;color:#fff;direction:ltr}
.wb span+span{font-size:14px}
.mp{background:#ffffff18;border-radius:18px;padding:12px;font-size:16px;line-height:1.6}
.mp a{display:inline-block;margin-top:6px;color:#000;background:var(--gold);padding:8px 18px;border-radius:20px;font-weight:700}
.w2 .go{animation:sh 3s linear infinite,pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.04)}}
body,button,input,textarea,select{font-family:'Noto Sans Arabic',Tahoma,sans-serif}
.v2{position:fixed;inset:0;z-index:100;overflow:auto;background:#070605;display:flex;flex-direction:column;align-items:center;padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(34px + env(safe-area-inset-bottom,0px));text-align:center}
.v2:before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 0,#e6b42230,transparent 70%),radial-gradient(50% 35% at 50% 100%,#8a1c1c40,transparent 70%);pointer-events:none}
.v2>*{flex:none;position:relative;opacity:0;transform:translateY(18px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.v2 .mt{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:4px;color:#e6b422aa;animation-delay:.05s}
.mb{background:#ffffff10;border:1px solid #e6b42240;color:#e6b422;border-radius:20px;padding:7px 14px;font-size:13px;letter-spacing:0}
.lg2{width:158px;height:158px;border-radius:50%;margin-top:22px;padding:5px;background:linear-gradient(145deg,#ffe58a,#8a6508 50%,#ffe58a);box-shadow:0 0 0 8px #e6b4221a,0 20px 60px #e6b42240;animation-delay:.15s}
.lg2 img{width:100%;height:100%;border-radius:50%;background:#fff;object-fit:cover;display:block}
.v2 h2{font-weight:300;font-size:19px;color:#efe6cf;margin:26px 0 2px;animation-delay:.3s}
.v2 h1{font-weight:800;font-size:48px;line-height:1.25;margin:0;background:linear-gradient(180deg,#fff0b8,#e6b422 55%,#a87a0c);-webkit-background-clip:text;background-clip:text;color:transparent;animation-delay:.4s}
.dv{display:flex;align-items:center;gap:12px;width:70%;margin:12px 0 22px;color:#e6b422;font-size:14px;animation-delay:.5s}
.dv:before,.dv:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#e6b42280,transparent)}
.cd2{width:100%;max-width:430px;border:1px solid #e6b4222e;background:linear-gradient(160deg,#ffffff0d,#ffffff04);border-radius:22px;overflow:hidden;backdrop-filter:blur(10px);animation-delay:.6s}
.rw{display:flex;align-items:center;gap:14px;padding:15px 18px;text-align:right;border-bottom:1px solid #ffffff12;color:#f5efe0}
.rw:last-child{border:0}
.rw i{flex:none;width:42px;height:42px;border-radius:13px;background:#e6b4221c;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:19px}
.rw b{display:block;font-weight:500;font-size:19px;direction:ltr;text-align:right;letter-spacing:1px}
.rw small{color:#a99f8a;font-size:12px}
.rw em{margin-inline-start:auto;color:#e6b422;font-style:normal;font-size:24px}
.v2 .go{margin-top:26px;padding:18px;font-size:21px;color:#fff;font-weight:800;text-shadow:0 2px 4px #000,0 0 12px #000;animation:up .8s .7s cubic-bezier(.2,.8,.2,1) forwards,sh 3s linear infinite}
.v2 .soc{margin-top:26px;animation-delay:.85s}
.v2 .soc a{width:46px;height:46px;border-radius:50%}
.v2 .soc svg{width:23px;height:23px}
.v2 .pw{margin-top:18px;animation:up .8s 1s forwards,gl 2s ease-in-out infinite}
</style></head><body>

function editCat(){const c=D.cats[cur];const o=modal(`<h3 style="color:var(--gold)">تعديل القسم</h3><input id="cn" value="${c.n}"><button class="btn g" id="cg">🖼 رفع صورة من الاستوديو</button><button class="btn" id="cs">حفظ</button><button class="btn g" id="cd" style="color:#ff7a7a">حذف القسم</button>`,1);
o.querySelector("#cg").onclick=()=>pick(d=>{c.img=d;o.querySelector("#cg").textContent="✅ تم"});
o.querySelector("#cs").onclick=()=>{c.n=o.querySelector("#cn").value;save();o.remove();draw()};
const b=o.querySelector("#cd");b.onclick=()=>cf(b,()=>{D.cats.splice(cur,1);cur=0;save();o.remove();draw()})}
function openCart(){const ks=Object.keys(cart);let tot=0;
const lines=ks.map(k=>{const[id,l]=k.split("|"),it=find(id);if(!it)return"";const p=it.p.find(x=>x[0]==l)||it.p[0];tot+=p[1]*cart[k];return `<div class="ln"><div>${it.n} ${l?"("+l+")":""}<br><small style="color:var(--gold)">${fmt(p[1])}</small></div><div class="pm"><button data-ca="${k}">+</button><span class="q">${cart[k]}</span><button data-cm="${k}">−</button></div></div>`}).join("");
const o=modal(`<h3 style="color:var(--gold)">🧺 سلة الطلب</h3>${lines||"<p>السلة فارغة</p>"}${ks.length?`<h3>المجموع: ${fmt(tot)}</h3>
<label>الاسم</label><input id="fn"><label>العنوان</label><input id="fa"><label>رقم الهاتف</label><input id="fp" type="tel" dir="ltr"><label>أقرب نقطة دالة</label><input id="fl"><label>ملاحظات (اختياري)</label><textarea id="fo" rows="2"></textarea><label>إرسال إلى</label><select id="ft">${D.phones.map(p=>`<option>${p}</option>`).join("")}</select><div class="er" id="er"></div><button class="btn" id="sd">إرسال الطلب عبر واتساب ✅</button>`:""}`);
o.querySelectorAll("[data-ca]").forEach(b=>b.onclick=()=>{cart[b.dataset.ca]++;burst(b,["🔥","🤩","✅","💙"]);setTimeout(()=>{o.remove();openCart();draw()},350)});
o.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{const k=b.dataset.cm;cart[k]--;if(cart[k]<=0)delete cart[k];burst(b,["❌","🥰"]);setTimeout(()=>{o.remove();openCart();draw()},350)});
const s=o.querySelector("#sd");if(s)s.onclick=()=>{const v=i=>o.querySelector(i).value.trim(),n=v("#fn"),a=v("#fa"),p=v("#fp"),l=v("#fl");
if(!n||!a||!p||!l){o.querySelector("#er").textContent="⚠ يرجى إدخال كل المعلومات (الاسم، العنوان، الهاتف، أقرب نقطة دالة)";return}
let m=`🍕 *طلب جديد - بيتزا الملوك* 🍕\n\n👤 الاسم: ${n}\n📍 العنوان: ${a}\n📞 الهاتف: ${p}\n🧭 أقرب نقطة دالة: ${l}\n\n🛒 *الطلب:*\n`;
ks.forEach(k=>{const[id,lb]=k.split("|"),it=find(id);if(it){const pr=it.p.find(x=>x[0]==lb)||it.p[0];m+=`• ${it.n} ${lb?"("+lb+")":""} × ${cart[k]} = ${fmt(pr[1]*cart[k])}\n`}});
m+=`\n💰 المجموع: ${fmt(tot)}`;const nt=v("#fo");if(nt)m+=`\n📝 ملاحظات: ${nt}`;
const u=wa(o.querySelector("#ft").value)+"?text="+encodeURIComponent(m);if(!window.open(u,"_blank"))o.querySelector("#er").innerHTML='<a class="btn" style="display:block;text-align:center" href="'+u+'" target="_blank">اضغط هنا لفتح واتساب ✅</a>'}}
let hi,sp=0,st;
function slides(){clearInterval(hi);const s=document.querySelectorAll(".sl"),d=document.querySelectorAll(".dots i");const go=()=>{s.forEach((x,i)=>x.classList.toggle("on",i==slide));d.forEach((x,i)=>x.classList.toggle("on",i==slide))};go();hi=setInterval(()=>{slide=(slide+1)%s.length;go()},3500);
const e=$("#strip");let pos=e.scrollLeft,dir=1,hold=0;cancelAnimationFrame(sp);
e.onpointerdown=e.ontouchstart=()=>hold=Date.now()+3500;
const t=()=>{if(Date.now()>hold){pos+=dir*.5;e.scrollLeft=pos;if(Math.abs(e.scrollLeft-pos)>1.5||e.scrollLeft+e.clientWidth>=e.scrollWidth-1&&dir>0||e.scrollLeft<=0&&dir<0){dir=-dir;pos=e.scrollLeft}}else pos=e.scrollLeft;sp=requestAnimationFrame(t)};sp=requestAnimationFrame(t)}
idbGet().then(d=>{if(d&&d.cats){D=d;draw();const l=document.querySelector(".lg2 img");if(l)l.src=D.logo}});try{navigator.storage.persist()}catch(e){}
draw();welcome();startMusic();["pointerdown","touchstart","keydown"].forEach(e=>addEventListener(e,ev=>{if(!(ev.target.closest&&ev.target.closest("#mu,#wm")))unlock()},{passive:true}));
</script></body></html>
